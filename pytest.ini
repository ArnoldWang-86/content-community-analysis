[pytest]
; 对应课程：【pytest 执行命令的选项】
; 把常用选项写进配置文件，之后直接敲 pytest 即可，不用每次带一长串参数

testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

; -v  显示每个用例名
; -ra 结尾汇总 skip/xfail 的原因
; --strict-markers 未注册的 marker 直接报错，避免拼错 marker 名却不生效
addopts = -v -ra --strict-markers

markers =
    unit: 单元测试（纯函数，不依赖外部服务）
    db: 需要 MySQL 的测试
    slow: 耗时较长的测试
    llm: 需要调用大模型 API 的测试（默认不跑）

; 生成 HTML 测试报告
; 对应课程：【pytest-html 插件的简介和安装】【pytest-html 的详细用法】
; 用法：pytest --html=report.html --self-contained-html
